services:
  postgres:
    restart: unless-stopped
    labels:
      autoheal: "true"

  cache:
    restart: unless-stopped
    labels:
      autoheal: "true"

  backend:
    image: ${WATCHTOWER_API_IMAGE:-watchtower-api}
    build: !reset []
    volumes: !reset []
    command:
      - sh
      - -c
      - alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    labels:
      autoheal: "true"

  frontend:
    image: ${WATCHTOWER_FRONTEND_IMAGE:-watchtower-frontend}
    build: !reset []
    volumes: !reset []
    restart: unless-stopped
    labels:
      autoheal: "true"
